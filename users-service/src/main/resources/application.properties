spring.application.name=${USERS_SERVICE_NAME:users-service}
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/users_db}
server.port=${USERS_SERVER_PORT:${SERVER_PORT:8081}}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@clouddrive.local}
spring.mail.password=${SPRING_MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${SPRING_MAIL_AUTH:false}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${SPRING_MAIL_STARTTLS:false}}

app.reset-url=${APP_RESET_URL:http://localhost:4200/reset-lozinke}
app.blokada-minuta=${APP_BLOKADA_MINUTA:15}
app.lozinka-maks-dana=${APP_LOZINKA_MAKS_DANA:60}
app.lozinka-min-dana=${APP_LOZINKA_MIN_DANA:1}
internal.service.token=${INTERNAL_SERVICE_TOKEN:}