
spring.application.name=files-service

server.port=${SERVER_PORT:8082}

spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/files_db}

# Adresa Users servisa
users.service.url=${USERS_SERVICE_URL:http://localhost:8081}

# Interni token za komunikaciju mikroservisa
internal.service.token=${INTERNAL_SERVICE_TOKEN:}

# Maksimalna velicina fajla
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
