spring.application.name=${FILES_SERVICE_NAME:files-service}

server.port=${FILES_SERVER_PORT:${SERVER_PORT:8082}}

spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/files_db}

users.service.url=${USERS_SERVICE_URL:http://localhost:8081}

internal.service.token=${INTERNAL_SERVICE_TOKEN:}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:52MB}