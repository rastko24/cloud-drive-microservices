<div class="registracija-kontejner container-fluid min-vh-100 d-flex align-items-center justify-content-center p-4">
  <div class="kartica-okvir border-0 rounded-4 overflow-hidden shadow-lg w-100" style="max-width: 1100px;">
    <div class="row g-0">
      
      <div class="col-lg-8 p-5 bg-white">
        <div class="mb-4">
          <h2 class="fw-bold text-dark">Kreirajte nalog</h2>
          <p class="text-muted small">Unesite vaše podatke za registraciju novog naloga</p>
        </div>

        <form (ngSubmit)="registrujSe()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label text-secondary small fw-semibold">Ime</label>
              <input type="text" class="form-control form-control-lg fs-6" [(ngModel)]="ime" name="ime" placeholder="Vaše ime" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label text-secondary small fw-semibold">Prezime</label>
              <input type="text" class="form-control form-control-lg fs-6" [(ngModel)]="prezime" name="prezime" placeholder="Vaše prezime" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">E-mail adresa</label>
            <input type="email" class="form-control form-control-lg fs-6" [(ngModel)]="email" name="email" placeholder="ime@example.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Lozinka</label>
            <input type="password" class="form-control form-control-lg fs-6" [(ngModel)]="lozinka" name="lozinka" required 
                   placeholder="Min. 8 karaktera, veliko slovo, broj, specijalni znak">
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Ponovljena lozinka</label>
            <input type="password" class="form-control form-control-lg fs-6" [(ngModel)]="potvrdaLozinke" name="potvrdaLozinke" placeholder="Ponovite lozinku" required>
          </div>

          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="uslovi" required>
            <label class="form-check-label text-muted small" for="uslovi">Prihvatam uslove korišćenja ugovora</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-semibold shadow-sm">Registruj se</button>
        </form>
      </div>

      <div class="col-lg-4 desni-panel text-white d-flex flex-column align-items-center justify-content-center p-4 text-center position-relative overflow-hidden">
        <div class="dekorativni-krug krug-1"></div>
        <div class="dekorativni-krug krug-2"></div>

        <div class="position-relative z-1">
          <h3 class="fw-bold mb-3">Dobrodošli nazad!</h3>
          <p class="text-light small mb-4 opacity-75">Već imate nalog? Prijavite se ovde da pristupite svojim fajlovima.</p>
          <a href="#" class="btn btn-outline-light rounded-pill px-4 py-2 fw-semibold text-decoration-none">Prijavi se</a>
        </div>
      </div>

    </div>
  </div>
</div>
