<div class="prijava-kontejner container-fluid min-vh-100 d-flex align-items-center justify-content-center p-4">
  <div class="kartica-okvir rounded-4 overflow-hidden w-100" style="max-width: 1100px;">
    <div class="row g-0">

      <div class="col-lg-8 p-5 bg-white">
        <h2 class="fw-bold text-dark mb-3">Prijava u toku</h2>

        @if (ucitava) {
          <p class="text-muted">Proveravamo vaš magični link i prijavljujemo vas na nalog...</p>
        }

        @if (!ucitava && greska) {
          <div class="alert alert-danger">{{ greska }}</div>
          <div class="d-flex gap-3 mt-3">
            <a routerLink="/magic-link-prijava" class="povratak-link fw-semibold text-decoration-none">
              Zatraži novi link
            </a>
            <a routerLink="/login" class="povratak-link fw-semibold text-decoration-none">
              Nazad na prijavu
            </a>
          </div>
        }
      </div>

      <div class="col-lg-4 desni-panel text-white d-flex flex-column align-items-center justify-content-center p-4 text-center position-relative overflow-hidden">
        <div class="dekorativni-krug krug-1"></div>
        <div class="dekorativni-krug krug-2"></div>

        <div class="position-relative z-1">
          <h3 class="fw-bold mb-3">Cloud Drive</h3>
          <p class="text-light small opacity-75">
            Bezbedna i brza prijava putem jednokratnog linka.
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
