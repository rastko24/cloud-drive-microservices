server:
  port: ${GATEWAY_SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            - id: users-servis
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**

            - id: files-folderi
              uri: ${FILES_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/folderi/**

            - id: files-fajlovi
              uri: ${FILES_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/fajlovi/**

            - id: notifications-servis
              uri: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/notifikacije/**