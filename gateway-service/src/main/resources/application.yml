server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          routes:
            - id: users-servis
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**

            - id: files-folderi
              uri: ${FILES_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/folderi/**

            - id: files-fajlovi
              uri: ${FILES_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/fajlovi/**